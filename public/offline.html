<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #25282b; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: rgba(255,255,255,.7); line-height: 1.5; margin: 0 0 24px; }
  .dot { width: 56px; height: 56px; border-radius: 16px; background: #1e5a46; color: #c5a059; display: grid; place-items: center; margin: 0 auto; font-weight: 700; font-size: 22px; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #1e5a46; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="dot">!</div>
  <h1>No se puede conectar con el ordenador de la tienda</h1>
  <p>Compruebe que el ordenador de la tienda está encendido con la app abierta y que este dispositivo está en la misma Wi-Fi.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
